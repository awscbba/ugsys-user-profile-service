[project]
name = "ugsys-user-profile-service"
version = "0.1.0"
description = "User profile service — demographic & contact data for the ugsys platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "structlog>=24.1",
    "mangum>=0.17",
    "ugsys-auth-client",
    "ugsys-logging-lib",
    "ugsys-event-lib",
    "aioboto3>=13.0",
    "python-multipart>=0.0.22",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[dynamodb]>=1.34",
    "bandit[toml]>=1.7",
    "safety>=3.2",
]

[tool.uv.sources]
ugsys-auth-client = { git = "https://github.com/awscbba/ugsys-shared-libs", tag = "auth-client/v0.1.0", subdirectory = "auth-client" }
ugsys-logging-lib  = { git = "https://github.com/awscbba/ugsys-shared-libs", tag = "logging-lib/v0.1.0",  subdirectory = "logging-lib" }
ugsys-event-lib    = { git = "https://github.com/awscbba/ugsys-shared-libs", tag = "event-lib/v0.1.0",    subdirectory = "event-lib" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ANN", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/config.py",
    "src/infrastructure/persistence/*",
    "src/infrastructure/adapters/*",
    "src/infrastructure/messaging/event_publisher.py",
    "src/infrastructure/logging.py",
    "src/presentation/api/v1/health.py",
    "src/presentation/api/v1/profiles.py",
    "src/presentation/middleware/correlation_id.py",
    "src/presentation/middleware/rate_limiting.py",
    "src/presentation/middleware/security_headers.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aioboto3>=13.0",
    "hypothesis>=6.151.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
